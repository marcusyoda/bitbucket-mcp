name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing: the job proves its identity to the registry
  # through this OIDC token, so no long lived npm credential is stored in the repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 20 ships an older npm.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The release tag is the contract. Publishing a tag that disagrees with the manifest
      # puts a version on npm that no commit in this repository claims.
      - name: Guard tag against package version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(node -p "require('./package.json').version")
          echo "tag: $TAG | package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # No NODE_AUTH_TOKEN on purpose: the registry authenticates this job by OIDC, and
      # provenance is attached automatically by trusted publishing.
      - name: Publish to npm
        run: npm publish --access public
